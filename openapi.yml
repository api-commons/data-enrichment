openapi: 3.1.0
info:
  title: Data Enrichment (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common Data Enrichment interface, distilled from the harvested OpenAPI of 137 providers in the
    APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /person-profiles:
    post:
      operationId: createPersonProfile
      summary: Create a person profile
      tags:
      - Person Profiles
      x-commons-tier: core
      x-commons-share: 0.615
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/PersonProfile'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
    get:
      operationId: listPersonProfiles
      summary: List person profiles
      tags:
      - Person Profiles
      x-commons-tier: core
      x-commons-share: 0.538
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id001
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /person-profiles/{person_profile_id}:
    parameters:
    - $ref: '#/components/parameters/person_profile_id'
    get:
      operationId: getPersonProfile
      summary: Get a person profile
      tags:
      - Person Profiles
      x-commons-tier: extended
      x-commons-share: 0.308
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
  /company-profiles:
    post:
      operationId: createCompanyProfile
      summary: Create a company profile
      tags:
      - Company Profiles
      x-commons-tier: core
      x-commons-share: 0.657
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/CompanyProfile'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
    get:
      operationId: listCompanyProfiles
      summary: List company profiles
      tags:
      - Company Profiles
      x-commons-tier: core
      x-commons-share: 0.571
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id002
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /company-profiles/{company_profile_id}:
    parameters:
    - $ref: '#/components/parameters/company_profile_id'
    get:
      operationId: getCompanyProfile
      summary: Get a company profile
      tags:
      - Company Profiles
      x-commons-tier: core
      x-commons-share: 0.514
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
  /email-lookups:
    post:
      operationId: createEmailLookup
      summary: Create an email lookup
      tags:
      - Email Lookups
      x-commons-tier: core
      x-commons-share: 0.714
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id003
                $ref: '#/components/schemas/EmailLookup'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id003
    get:
      operationId: listEmailLookups
      summary: List email lookups
      tags:
      - Email Lookups
      x-commons-tier: extended
      x-commons-share: 0.429
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id003
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
components:
  schemas:
    PersonProfile:
      $ref: ./schema/person_profile.json
    CompanyProfile:
      $ref: ./schema/company_profile.json
    EmailLookup:
      $ref: ./schema/email_lookup.json
  parameters:
    person_profile_id:
      name: person_profile_id
      in: path
      required: true
      schema:
        type: string
    company_profile_id:
      name: company_profile_id
      in: path
      required: true
      schema:
        type: string
    email_lookup_id:
      name: email_lookup_id
      in: path
      required: true
      schema:
        type: string
